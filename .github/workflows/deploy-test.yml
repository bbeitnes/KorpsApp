name: Deploy to TEST via SFTP
on:
  push:
    branches:
      - test
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # SFTP-steget laster opp './*', så config/ ville fulgt med og lagt andre
      # kunders oppsett ut på denne kundens vert. Kopier ut, rydd bort resten.
      # API-nøkkelen ligger ikke i repoet (det er offentlig): kundeoppsettet har
      # en plassholder som byttes ut med secreten her. Mangler secreten, stopper
      # utrullingen i stedet for å legge ut en app som ikke kan logge inn.
      - name: Velg kundeoppsett
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          test -n "$FIREBASE_API_KEY" || { echo "Mangler secret FIREBASE_API_KEY"; exit 1; }
          sed "s|__FIREBASE_API_KEY__|$FIREBASE_API_KEY|" config/skolekorps.js > config.js
          if grep -q "__FIREBASE_API_KEY__" config.js; then echo "Plassholderen står igjen i config.js"; exit 1; fi
          rm -rf config
      - name: Deploy to server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          local_path: './*'
          remote_path: '/customers/7/7/8/chd71y6vo/webroots/r1057943/Korpsapp-test'
          sftp_only: true
