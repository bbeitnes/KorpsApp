name: Slett merget branch

on:
  pull_request:
    types: [closed]

jobs:
  slett:
    # Bare når PR-en faktisk ble merget — lukkede-uten-merge PR-er har ofte
    # arbeid som skal fortsette på branchen.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Slett head-branchen
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;

            // main og test er permanente miljø-brancher (deploy.yml og
            // deploy-test.yml trigger på push til dem). En PR fra test til
            // main ville ellers slettet testmiljøets branch.
            const behold = ['main', 'test'];
            if (behold.includes(branch)) {
              core.info(`Beholder '${branch}' — permanent miljø-branch.`);
              return;
            }

            // Fork-PR-er har head i et annet repo, som vi verken kan eller
            // skal røre.
            if (context.payload.pull_request.head.repo.full_name !== context.payload.repository.full_name) {
              core.info(`Beholder '${branch}' — ligger i et annet repo (fork).`);
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Slettet '${branch}'.`);
            } catch (error) {
              // 422 betyr som regel at branchen allerede er borte — noen rakk
              // å slette den manuelt. Det er ikke en feil verdt å feile på.
              if (error.status === 422) {
                core.info(`'${branch}' var allerede slettet.`);
                return;
              }
              throw error;
            }
